<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Mandats & Rôles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0c1221;--surface:#131929;--surface2:#1b2338;--accent:#3b82f6;--accent2:#6366f1;--accent3:#818cf8;--accent4:#60a5fa;--text:#dde3f0;--muted:#64748b;--border:rgba(255,255,255,0.07);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
        .main-content{margin-left:250px;padding:32px;}

        .page-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,var(--accent4),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
        .page-sub{color:var(--muted);font-size:.88rem;margin-bottom:32px;}

        .mandat-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:16px;transition:all .3s;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
        .mandat-card:hover{border-color:rgba(255,255,255,.1);transform:translateY(-2px);}
        .mandat-card.actif{border-color:rgba(59,130,246,.2);}

        .mandat-avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent4),var(--accent3));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:#0a0e1a;flex-shrink:0;}
        .mandat-info{flex:1;min-width:200px;}
        .mandat-name{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;margin-bottom:4px;}
        .mandat-role{display:inline-flex;align-items:center;gap:6px;background:rgba(96,165,250,.1);color:var(--accent4);border:1px solid rgba(96,165,250,.2);border-radius:20px;padding:3px 12px;font-size:.73rem;font-weight:700;}
        .mandat-date{color:var(--muted);font-size:.8rem;margin-top:6px;}

        .badge-actif{background:rgba(59,130,246,.12);color:var(--accent);border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:4px 14px;font-size:.73rem;font-weight:700;}
        .badge-cloture{background:rgba(100,116,139,.1);color:var(--muted);border:1px solid rgba(100,116,139,.15);border-radius:20px;padding:4px 14px;font-size:.73rem;font-weight:700;}

        .btn-cloturer{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.25);color:var(--accent4);border-radius:8px;padding:7px 16px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;}
        .btn-cloturer:hover{background:rgba(96,165,250,.2);}

        .empty-state{text-align:center;padding:64px;color:var(--muted);}
    </style>
</head>
<body>
<div th:replace="~{sidebar :: sidebar}"></div>

<div class="main-content">
    <div class="page-title">Mandats & Rôles</div>
    <div class="page-sub">Gestion des mandats de direction et des rôles attribués</div>

    <div th:if="${mandats != null and !mandats.isEmpty()}">
        <div th:each="m : ${mandats}" th:class="${m.estActif ? 'mandat-card actif' : 'mandat-card'}">

            <div class="mandat-avatar"
                 th:text="${m.responsable != null and !#strings.isEmpty(m.responsable.nom) ? #strings.toUpperCase(#strings.substring(m.responsable.nom,0,1)) : '?'}"></div>

            <div class="mandat-info">
                <div class="mandat-name"
                     th:text="${m.responsable != null ? m.responsable.nom + ' ' + m.responsable.prenom : 'N/A'}"></div>
                <span class="mandat-role">
                    <i class="fa-solid fa-gavel" style="font-size:.65rem"></i>
                    <span th:text="${m.role}"></span>
                </span>
                <div class="mandat-date">
                    <i class="fa-solid fa-calendar-check me-1"></i>
                    Depuis le
                    <span th:text="${m.dateDebut != null ? #dates.format(m.dateDebut, 'dd/MM/yyyy') : 'N/A'}"></span>
                </div>
            </div>

            <div>
                <span th:if="${m.estActif}" class="badge-actif">
                    <i class="fa-solid fa-circle" style="font-size:.5rem;margin-right:4px"></i>Actif
                </span>
                <span th:unless="${m.estActif}" class="badge-cloture">Clôturé</span>
            </div>

            <!-- Seul l'Admin système peut clôturer un mandat -->
            <form th:if="${m.estActif and isAdminActif}"
                  th:action="@{/mandats/{id}/cloturer(id=${m.idMandat})}" method="POST">
                <button type="submit" class="btn-cloturer">
                    <i class="fa-solid fa-stop-circle me-1"></i>Clôturer
                </button>
            </form>
        </div>
    </div>

    <div th:if="${mandats == null or mandats.isEmpty()}" class="empty-state">
        <i class="fa-solid fa-gavel fa-3x d-block mb-3" style="opacity:.25"></i>
        <p>Aucun mandat enregistré pour le moment.</p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
