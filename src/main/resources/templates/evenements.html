<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Événements Scientifiques</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0c1221;--surface:#131929;--surface2:#1b2338;--accent:#3b82f6;--accent2:#6366f1;--accent3:#818cf8;--accent4:#60a5fa;--text:#dde3f0;--muted:#64748b;--border:rgba(255,255,255,0.07);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
        .main-content{margin-left:250px;padding:32px;}

        .page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;flex-wrap:wrap;gap:16px;}
        .page-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,var(--accent3),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .page-sub{color:var(--muted);font-size:.88rem;margin-top:4px;}

        .btn-add{background:linear-gradient(135deg,var(--accent3),var(--accent2));color:#0a0e1a;border:none;border-radius:10px;padding:10px 20px;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .3s;}
        .btn-add:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(129,140,248,.35);color:#0a0e1a;}

        /* Stats row */
        .stats-row{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap;}
        .stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px 18px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;}

        /* Event cards */
        .ev-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:all .3s;height:100%;display:flex;flex-direction:column;}
        .ev-card:hover{border-color:rgba(255,255,255,.1);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.4);}

        .ev-accent-bar{height:3px;}
        .ev-accent-conference{background:linear-gradient(90deg,var(--accent),var(--accent2));}
        .ev-accent-seminaire{background:linear-gradient(90deg,var(--accent2),#818cf8);}
        .ev-accent-workshop{background:linear-gradient(90deg,var(--accent3),var(--accent4));}

        .ev-body{padding:20px 22px;flex:1;display:flex;flex-direction:column;}

        .ev-type-CONFERENCE{background:rgba(59,130,246,.1);color:var(--accent);border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:3px 12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
        .ev-type-SEMINAIRE{background:rgba(99,102,241,.1);color:var(--accent2);border:1px solid rgba(99,102,241,.2);border-radius:20px;padding:3px 12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
        .ev-type-WORKSHOP{background:rgba(129,140,248,.1);color:var(--accent3);border:1px solid rgba(129,140,248,.2);border-radius:20px;padding:3px 12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}

        .edition-chip{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.15);color:var(--accent4);border-radius:20px;padding:3px 10px;font-size:.7rem;font-weight:600;}

        .ev-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin:14px 0 12px;line-height:1.3;}

        .ev-meta{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
        .ev-meta-row{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);}
        .ev-meta-row i{width:14px;text-align:center;}

        .ev-desc{font-size:.82rem;color:var(--muted);line-height:1.5;margin-bottom:16px;flex:1;}

        .ev-actions{display:flex;gap:8px;margin-top:auto;}
        .btn-ev-edit{background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);color:var(--accent2);border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:600;text-decoration:none;flex:1;text-align:center;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
        .btn-ev-edit:hover{background:rgba(99,102,241,.16);color:var(--accent2);}
        .btn-ev-del{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);color:#fca5a5;border-radius:8px;padding:7px 12px;font-size:.8rem;text-decoration:none;transition:all .2s;display:flex;align-items:center;gap:6px;}
        .btn-ev-del:hover{background:rgba(248,113,113,.16);color:#fca5a5;}

        .empty-state{text-align:center;padding:80px;color:var(--muted);}

        .btn-cal{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:var(--accent);border-radius:10px;padding:10px 18px;font-size:.85rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .2s;}
        .btn-cal:hover{background:rgba(59,130,246,.15);color:var(--accent);}
    </style>
</head>
<body>
<div th:replace="~{sidebar :: sidebar}"></div>

<div class="main-content">
    <div class="page-header">
        <div>
            <div class="page-title">Événements Scientifiques</div>
            <div class="page-sub">Conférences, séminaires et workshops du laboratoire LIAS</div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
            <a href="/evenements/calendrier" class="btn-cal">
                <i class="fa-solid fa-calendar-check"></i>Calendrier
            </a>
            <a href="/evenements/nouveau" class="btn-add"
               sec:authorize="hasAnyAuthority('PERMANENT','ROLE_PERMANENT','DIRECTEUR','ROLE_DIRECTEUR')">
                <i class="fa-solid fa-plus"></i>Nouvel Événement
            </a>
        </div>
    </div>

    <!-- Stats pills -->
    <div class="stats-row">
        <div class="stat-pill">
            <i class="fa-solid fa-calendar-days" style="color:var(--accent3)"></i>
            <span th:text="${evenements.size()} + ' total'">0 total</span>
        </div>
        <div class="stat-pill">
            <i class="fa-solid fa-microphone" style="color:var(--accent)"></i>
            <span th:text="${#lists.size(evenements.?[type.name() == 'CONFERENCE'])} + ' conférences'">0 conférences</span>
        </div>
        <div class="stat-pill">
            <i class="fa-solid fa-chalkboard-teacher" style="color:var(--accent2)"></i>
            <span th:text="${#lists.size(evenements.?[type.name() == 'SEMINAIRE'])} + ' séminaires'">0 séminaires</span>
        </div>
        <div class="stat-pill">
            <i class="fa-solid fa-screwdriver-wrench" style="color:var(--accent3)"></i>
            <span th:text="${#lists.size(evenements.?[type.name() == 'WORKSHOP'])} + ' workshops'">0 workshops</span>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(evenements)}" class="empty-state">
        <i class="fa-solid fa-calendar-xmark fa-3x d-block mb-3" style="opacity:.2"></i>
        <p style="margin-bottom:16px">Aucun événement enregistré pour le moment.</p>
        <a href="/evenements/nouveau" class="btn-add"
           sec:authorize="hasAnyAuthority('PERMANENT','ROLE_PERMANENT','DIRECTEUR','ROLE_DIRECTEUR')">
            <i class="fa-solid fa-plus"></i>Créer le premier événement
        </a>
    </div>

    <!-- Cards grid -->
    <div class="row g-4" th:unless="${#lists.isEmpty(evenements)}">
        <div class="col-md-6 col-lg-4" th:each="ev : ${evenements}">
            <div class="ev-card">
                <!-- Accent bar colorée selon type -->
                <div th:class="${ev.type.name() == 'CONFERENCE' ? 'ev-accent-bar ev-accent-conference' :
                                (ev.type.name() == 'SEMINAIRE' ? 'ev-accent-bar ev-accent-seminaire' :
                                 'ev-accent-bar ev-accent-workshop')}"></div>

                <div class="ev-body">
                    <!-- Badge type + edition -->
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <span th:class="${'ev-type-' + ev.type.name()}" th:text="${ev.type}"></span>
                        <span th:if="${ev.edition > 0}" class="edition-chip">
                            <i class="fa-solid fa-hashtag" style="font-size:.6rem"></i>
                            Éd. <span th:text="${ev.edition}"></span>
                        </span>
                    </div>

                    <!-- Titre -->
                    <div class="ev-title" th:text="${ev.titre}"></div>

                    <!-- Meta infos -->
                    <div class="ev-meta">
                        <div class="ev-meta-row" th:if="${ev.date != null}">
                            <i class="fa-solid fa-calendar" style="color:var(--accent)"></i>
                            <span th:text="${#temporals.format(ev.date,'dd MMMM yyyy')}"></span>
                        </div>
                        <div class="ev-meta-row" th:if="${ev.lieu != null}">
                            <i class="fa-solid fa-location-dot" style="color:var(--accent3)"></i>
                            <span th:text="${ev.lieu}"></span>
                        </div>
                        <div class="ev-meta-row" th:if="${ev.organisateur != null}">
                            <i class="fa-solid fa-user" style="color:var(--accent2)"></i>
                            <span th:text="${(ev.organisateur.prenom ?: '') + ' ' + (ev.organisateur.nom ?: '')}"></span>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="ev-desc" th:if="${ev.description != null}"
                         th:text="${#strings.abbreviate(ev.description, 110)}"></div>

                    <!-- Actions (PERMANENT / DIRECTEUR uniquement) -->
                    <div class="ev-actions"
                         sec:authorize="hasAnyAuthority('PERMANENT','ROLE_PERMANENT','DIRECTEUR','ROLE_DIRECTEUR')">
                        <a th:href="@{/evenements/modifier/{id}(id=${ev.id})}" class="btn-ev-edit">
                            <i class="fa-solid fa-pen"></i>Modifier
                        </a>
                        <a th:href="@{/evenements/supprimer/{id}(id=${ev.id})}" class="btn-ev-del"
                           onclick="return confirm('Supprimer cet événement ?')">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
