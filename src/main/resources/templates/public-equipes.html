<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Nos Équipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#05070f;--surface:#0d1117;--surface2:#111827;--accent:#3b82f6;--accent2:#6366f1;--accent3:#818cf8;--accent4:#60a5fa;--text:#e2e8f0;--muted:#64748b;--border:rgba(255,255,255,0.06); }
        * { margin:0;padding:0;box-sizing:border-box; }
        body { background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh; }
        .bg-glow { position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% -10%,rgba(59,130,246,0.07),transparent),radial-gradient(ellipse 50% 40% at 100% 80%,rgba(99,102,241,0.05),transparent);pointer-events:none; }

        nav { position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(5,7,15,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border); }
        .nav-brand { display:flex;align-items:center;gap:12px;text-decoration:none; }
        .nav-icon { width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#05070f;font-size:.9rem; }
        .nav-title { font-family:'Syne',sans-serif;font-weight:800;font-size:1.05rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
        .btn-back { background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px 16px;text-decoration:none;font-size:.85rem;transition:all .2s; }
        .btn-back:hover { background:rgba(255,255,255,0.1);color:var(--text); }

        .content { padding:110px 0 60px; }
        .page-label { display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.25);color:var(--accent);border-radius:20px;padding:6px 18px;font-size:.78rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px; }
        .page-title { font-family:'Syne',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;margin-bottom:12px; }
        .page-sub { color:var(--muted);font-size:1rem;line-height:1.7;max-width:560px;margin-bottom:40px; }

        .membre-card { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;transition:all .3s;height:100%; }
        .membre-card:hover { transform:translateY(-5px);border-color:rgba(59,130,246,0.2);box-shadow:0 12px 40px rgba(0,0,0,.35); }
        .membre-avatar { width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:#05070f;margin-bottom:16px; }
        .membre-name { font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:4px; }
        .membre-email { color:var(--muted);font-size:.8rem;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

        .badge-statut { display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 12px;font-size:.7rem;font-weight:700; }
        .badge-PERMANENT { background:rgba(59,130,246,0.1);color:var(--accent);border:1px solid rgba(59,130,246,.2); }
        .badge-DOCTORANT { background:rgba(99,102,241,0.1);color:var(--accent2);border:1px solid rgba(99,102,241,.2); }
        .badge-ASSOCIE { background:rgba(129,140,248,0.1);color:var(--accent3);border:1px solid rgba(129,140,248,.2); }
        .badge-DIRECTEUR { background:rgba(96,165,250,0.1);color:var(--accent4);border:1px solid rgba(96,165,250,.2); }
        .badge-default { background:rgba(100,116,139,0.1);color:var(--muted);border:1px solid rgba(100,116,139,.15); }

        .equipe-section { margin-bottom:48px; }
        .equipe-header { display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border); }
        .equipe-dot { width:10px;height:10px;border-radius:50%;flex-shrink:0; }
        .equipe-name { font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700; }
        .equipe-count { background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:3px 12px;font-size:.75rem; }
        .empty-state { text-align:center;padding:80px 0;color:var(--muted); }
    </style>
</head>
<body>
<div class="bg-glow"></div>

<nav>
    <a href="/" class="nav-brand">
        <div class="nav-icon"><i class="fa-solid fa-flask-vial"></i></div>
        <span class="nav-title">Labo LIAS</span>
    </a>
    <div class="d-flex gap-2">
        <a href="/public/publications" class="btn-back">Publications</a>
        <a href="/public/activites" class="btn-back">Activités</a>
        <a href="/" class="btn-back"><i class="fa-solid fa-arrow-left me-1"></i>Accueil</a>
    </div>
</nav>

<div class="content">
    <div class="container">
        <div class="page-label"><i class="fa-solid fa-users-gear"></i>Chercheurs LIAS</div>
        <h1 class="page-title">Nos <span style="background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Équipes</span> de Recherche</h1>
        <p class="page-sub">Les chercheurs, doctorants et membres associés qui composent le laboratoire LIAS.</p>

        <div th:if="${membres != null and !membres.isEmpty()}">

            <!-- Permanents / Directeur -->
            <div th:with="permanents=${membres.?[statutActuel?.name() == 'PERMANENT' or statutActuel?.name() == 'DIRECTEUR']}">
                <div th:if="${!permanents.isEmpty()}" class="equipe-section">
                    <div class="equipe-header">
                        <div class="equipe-dot" style="background:var(--accent)"></div>
                        <div class="equipe-name">Membres Permanents</div>
                        <div class="equipe-count" th:text="${permanents.size()} + ' membres'"></div>
                    </div>
                    <div class="row g-3">
                        <div th:each="m : ${permanents}" class="col-md-4 col-lg-3">
                            <div class="membre-card">
                                <div class="membre-avatar">
                                    <span th:text="${m.prenom != null and !m.prenom.isEmpty() ? m.prenom.substring(0,1).toUpperCase() : '?'}"></span>
                                </div>
                                <div class="membre-name" th:text="${m.prenom + ' ' + m.nom}"></div>
                                <div class="membre-email" th:text="${m.email}"></div>
                                <div class="badge-statut"
                                     th:classappend="${'badge-' + (m.statutActuel != null ? m.statutActuel.name() : 'default')}"
                                     th:text="${m.statutActuel}"></div>
                                <div th:if="${m.equipeActuelle != null and !m.equipeActuelle.isEmpty()}"
                                     style="margin-top:8px;font-size:.75rem;color:var(--muted)">
                                    <i class="fa-solid fa-layer-group me-1"></i>
                                    <span th:text="${m.equipeActuelle}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Doctorants -->
            <div th:with="doctorants=${membres.?[statutActuel?.name() == 'DOCTORANT']}">
                <div th:if="${!doctorants.isEmpty()}" class="equipe-section">
                    <div class="equipe-header">
                        <div class="equipe-dot" style="background:var(--accent2)"></div>
                        <div class="equipe-name">Doctorants</div>
                        <div class="equipe-count" th:text="${doctorants.size()} + ' membres'"></div>
                    </div>
                    <div class="row g-3">
                        <div th:each="m : ${doctorants}" class="col-md-4 col-lg-3">
                            <div class="membre-card">
                                <div class="membre-avatar" style="background:linear-gradient(135deg,var(--accent2),var(--accent3))">
                                    <span th:text="${m.prenom != null and !m.prenom.isEmpty() ? m.prenom.substring(0,1).toUpperCase() : '?'}"></span>
                                </div>
                                <div class="membre-name" th:text="${m.prenom + ' ' + m.nom}"></div>
                                <div class="membre-email" th:text="${m.email}"></div>
                                <div class="badge-statut badge-DOCTORANT">DOCTORANT</div>
                                <div th:if="${m.equipeActuelle != null and !m.equipeActuelle.isEmpty()}"
                                     style="margin-top:8px;font-size:.75rem;color:var(--muted)">
                                    <i class="fa-solid fa-layer-group me-1"></i>
                                    <span th:text="${m.equipeActuelle}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Associés -->
            <div th:with="associes=${membres.?[statutActuel?.name() == 'ASSOCIE']}">
                <div th:if="${!associes.isEmpty()}" class="equipe-section">
                    <div class="equipe-header">
                        <div class="equipe-dot" style="background:var(--accent3)"></div>
                        <div class="equipe-name">Membres Associés</div>
                        <div class="equipe-count" th:text="${associes.size()} + ' membres'"></div>
                    </div>
                    <div class="row g-3">
                        <div th:each="m : ${associes}" class="col-md-4 col-lg-3">
                            <div class="membre-card">
                                <div class="membre-avatar" style="background:linear-gradient(135deg,var(--accent3),var(--accent4))">
                                    <span th:text="${m.prenom != null and !m.prenom.isEmpty() ? m.prenom.substring(0,1).toUpperCase() : '?'}"></span>
                                </div>
                                <div class="membre-name" th:text="${m.prenom + ' ' + m.nom}"></div>
                                <div class="membre-email" th:text="${m.email}"></div>
                                <div class="badge-statut badge-ASSOCIE">ASSOCIÉ</div>
                                <div th:if="${m.equipeActuelle != null and !m.equipeActuelle.isEmpty()}"
                                     style="margin-top:8px;font-size:.75rem;color:var(--muted)">
                                    <i class="fa-solid fa-layer-group me-1"></i>
                                    <span th:text="${m.equipeActuelle}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div th:if="${membres == null or membres.isEmpty()}" class="empty-state">
            <i class="fa-solid fa-users-slash fa-4x mb-4 d-block" style="opacity:.3"></i>
            <p style="font-size:1.1rem">Aucun membre enregistré pour le moment.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
