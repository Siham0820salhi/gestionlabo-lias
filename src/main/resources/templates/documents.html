<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Archivage Documentaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0c1221;--surface:#131929;--surface2:#1b2338;--accent:#3b82f6;--accent2:#6366f1;--accent3:#818cf8;--accent4:#60a5fa;--text:#dde3f0;--muted:#64748b;--border:rgba(255,255,255,0.07); }
        * { margin:0;padding:0;box-sizing:border-box; }
        body { background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif; }
        .main-content { margin-left:250px;padding:32px; }
        .page-title { font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px; }
        .card-dark { background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px; }
        .table-dark-custom { color:var(--text); }
        .table-dark-custom thead th { background:var(--surface2);color:var(--muted);font-size:0.78rem;text-transform:uppercase;letter-spacing:1px;border:none;padding:14px 16px; }
        .table-dark-custom tbody tr { border-bottom:1px solid var(--border);transition:background .2s; }
        .table-dark-custom tbody tr:hover { background:rgba(255,255,255,0.03); }
        .table-dark-custom tbody td { padding:14px 16px;vertical-align:middle;border:none;font-size:0.88rem; }
        .badge-type { padding:4px 10px;border-radius:20px;font-size:0.72rem;font-weight:600; }
        .form-control-dark,.form-select-dark { background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 14px; }
        .form-control-dark:focus,.form-select-dark:focus { background:var(--surface2);border-color:var(--accent);color:var(--text);box-shadow:none; }
        .form-select-dark option { background:var(--surface2); }
        .btn-accent { background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0e1a;border:none;border-radius:10px;padding:10px 22px;font-weight:700; }
        .btn-del { background:rgba(248,113,113,0.1);color:#f87171;border:1px solid rgba(248,113,113,0.2);border-radius:8px;padding:6px 12px;font-size:0.8rem; }
        .search-bar { background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);width:280px; }
        .search-bar:focus { border-color:var(--accent);outline:none; }
    </style>
</head>
<body>
<div th:replace="~{sidebar :: sidebar}"></div>
<div class="main-content">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <div class="page-title"><i class="fa-solid fa-folder-open me-2"></i>Archivage Documentaire</div>
            <p style="color:var(--muted)">Gestion centralisée de tous les documents du laboratoire</p>
        </div>
        <form method="get" action="/documents" class="d-flex gap-2">
            <input type="text" name="q" class="search-bar" placeholder="Rechercher un document..." th:value="${q}"/>
            <button type="submit" class="btn-accent"><i class="fa-solid fa-search"></i></button>
        </form>
    </div>

    <!-- Formulaire upload -->
    <div class="card-dark mb-4">
        <div style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:16px">
            <i class="fa-solid fa-upload me-2" style="color:var(--accent)"></i>Uploader un document
        </div>
        <form method="post" action="/documents/uploader" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="nom" class="form-control-dark w-100" placeholder="Nom du document" required/>
                </div>
                <div class="col-md-2">
                    <select name="type" class="form-select-dark w-100" required>
                        <option value="">Type...</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="evenementId" class="form-select-dark w-100">
                        <option value="">Événement (optionnel)</option>
                        <option th:each="e : ${evenements}" th:value="${e.id}" th:text="${e.titre}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="text" name="description" class="form-control-dark w-100" placeholder="Description"/>
                </div>
                <div class="col-md-2">
                    <input type="file" name="fichier" class="form-control-dark w-100" required/>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn-accent w-100"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </form>
    </div>

    <!-- Liste documents -->
    <div class="card-dark">
        <div th:if="${documents != null and !documents.isEmpty()}">
            <table class="table table-dark-custom w-100">
                <thead>
                    <tr>
                        <th>Nom</th><th>Type</th><th>Événement</th><th>Uploadé par</th><th>Date</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="doc : ${documents}">
                        <td><i class="fa-solid fa-file me-2" style="color:var(--accent4)"></i><span th:text="${doc.nom}"></span></td>
                        <td><span class="badge-type" style="background:rgba(59,130,246,0.1);color:var(--accent)" th:text="${doc.type}"></span></td>
                        <td th:text="${doc.evenement != null ? doc.evenement.titre : '-'}"></td>
                        <td th:text="${doc.uploader != null ? doc.uploader.prenom + ' ' + doc.uploader.nom : '-'}"></td>
                        <td th:text="${doc.dateUpload != null ? #temporals.format(doc.dateUpload,'dd/MM/yyyy') : '-'}"></td>
                        <td>
                            <a th:if="${doc.cheminFichier != null}" th:href="'/uploads/documents/' + ${doc.cheminFichier}"
                               class="btn-del me-1" target="_blank"><i class="fa-solid fa-download"></i></a>
                            <a th:href="'/documents/supprimer/' + ${doc.id}" class="btn-del"
                               onclick="return confirm('Supprimer ce document ?')"><i class="fa-solid fa-trash"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${documents == null or documents.isEmpty()}" style="text-align:center;padding:60px 0;color:var(--muted)">
            <i class="fa-solid fa-folder-open fa-3x mb-3 d-block"></i>
            Aucun document archivé.
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
