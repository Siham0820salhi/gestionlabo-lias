<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Publications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0c1221;--surface:#131929;--surface2:#1b2338;--accent:#3b82f6;--accent2:#6366f1;--accent3:#818cf8;--accent4:#60a5fa;--text:#dde3f0;--muted:#64748b;--border:rgba(255,255,255,0.07);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
        .main-content{margin-left:250px;padding:32px;}

        .page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;flex-wrap:wrap;gap:16px;}
        .page-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,var(--accent4),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .page-sub{color:var(--muted);font-size:.88rem;margin-top:4px;}

        .btn-add{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0e1a;border:none;border-radius:10px;padding:10px 20px;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .3s;}
        .btn-add:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(59,130,246,.35);color:#0a0e1a;}

        /* Table */
        .table-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;}
        .table-dark-lias{width:100%;border-collapse:collapse;}
        .table-dark-lias thead tr{background:var(--surface2);border-bottom:1px solid var(--border);}
        .table-dark-lias thead th{padding:14px 18px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);white-space:nowrap;}
        .table-dark-lias tbody tr{border-bottom:1px solid var(--border);transition:background .2s;}
        .table-dark-lias tbody tr:last-child{border-bottom:none;}
        .table-dark-lias tbody tr:hover{background:rgba(255,255,255,.025);}
        .table-dark-lias tbody td{padding:14px 18px;font-size:.88rem;vertical-align:middle;}

        .pub-title-cell{font-weight:600;color:var(--text);max-width:280px;}
        .pub-author{color:var(--muted);font-size:.82rem;}
        .year-badge{background:var(--surface2);border:1px solid var(--border);color:var(--accent4);border-radius:8px;padding:3px 10px;font-size:.75rem;font-weight:600;}
        .journal-text{color:var(--accent2);font-size:.82rem;}
        .membre-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.15);border-radius:20px;padding:3px 10px;font-size:.75rem;color:var(--accent);}
        .equipe-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(129,140,248,.08);border:1px solid rgba(129,140,248,.15);border-radius:20px;padding:3px 10px;font-size:.72rem;color:var(--accent3);}

        .empty-row td{text-align:center;padding:48px;color:var(--muted);}
    </style>
</head>
<body>
<div th:replace="~{sidebar :: sidebar}"></div>

<div class="main-content">
    <div class="page-header">
        <div>
            <div class="page-title">Productions Scientifiques</div>
            <div class="page-sub">Liste de tous les articles, thèses et brevets du laboratoire LIAS</div>
        </div>
        <a href="/publications/nouveau" class="btn-add">
            <i class="fa-solid fa-plus"></i>Ajouter Publication
        </a>
    </div>

    <div class="table-card">
        <table class="table-dark-lias">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Titre</th>
                    <th>Auteurs</th>
                    <th>Année</th>
                    <th>Journal / Conférence</th>
                    <th>Équipe</th>
                    <th>Chercheur LIAS</th>
                    <th>Accès</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${publicationsList}">
                    <td style="color:var(--muted);font-size:.78rem" th:text="${p.idPublication}"></td>
                    <td class="pub-title-cell" th:text="${p.titre}"></td>
                    <td class="pub-author" th:text="${p.auteurs}"></td>
                    <td><span class="year-badge" th:text="${p.annee}"></span></td>
                    <td class="journal-text" th:text="${p.journalOuConference}"></td>
                    <td>
                        <span class="equipe-chip" th:if="${p.equipe != null and !p.equipe.isEmpty()}" th:text="${p.equipe}"></span>
                        <span style="color:var(--muted);font-size:.78rem" th:unless="${p.equipe != null and !p.equipe.isEmpty()}">—</span>
                    </td>
                    <td>
                        <span class="membre-chip" th:if="${p.membre != null}">
                            <i class="fa-solid fa-user" style="font-size:.65rem"></i>
                            <span th:text="${p.membre.prenom + ' ' + p.membre.nom}"></span>
                        </span>
                        <span style="color:var(--muted)" th:unless="${p.membre != null}">N/A</span>
                    </td>
                    <!-- Colonne Accès : lien URL + PDF -->
                    <td style="white-space:nowrap">
                        <a th:if="${p.lien != null and !p.lien.isEmpty()}"
                           th:href="${p.lien}" target="_blank"
                           style="display:inline-flex;align-items:center;gap:5px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);color:var(--accent2);border-radius:8px;padding:4px 10px;font-size:.75rem;font-weight:600;text-decoration:none;margin-right:6px;transition:background .2s"
                           onmouseover="this.style.background='rgba(99,102,241,.2)'"
                           onmouseout="this.style.background='rgba(99,102,241,.1)'">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>Lien
                        </a>
                        <a th:if="${p.fichierPdf != null and !p.fichierPdf.isEmpty()}"
                           th:href="@{/uploads/publications/{f}(f=${p.fichierPdf})}"
                           target="_blank"
                           style="display:inline-flex;align-items:center;gap:5px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);color:#fca5a5;border-radius:8px;padding:4px 10px;font-size:.75rem;font-weight:600;text-decoration:none;transition:background .2s"
                           onmouseover="this.style.background='rgba(248,113,113,.2)'"
                           onmouseout="this.style.background='rgba(248,113,113,.1)'">
                            <i class="fa-solid fa-file-pdf"></i>PDF
                        </a>
                        <span th:if="${(p.lien == null or p.lien.isEmpty()) and (p.fichierPdf == null or p.fichierPdf.isEmpty())}"
                              style="color:var(--muted);font-size:.78rem">—</span>
                    </td>
                </tr>
                <tr th:if="${publicationsList == null or publicationsList.isEmpty()}" class="empty-row">
                    <td colspan="8">
                        <i class="fa-solid fa-book-open fa-2x d-block mb-2" style="opacity:.3"></i>
                        Aucune publication enregistrée.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
