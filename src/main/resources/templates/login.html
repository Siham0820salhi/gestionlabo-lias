<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070f;
            --surface: #0d1117;
            --surface2: #111827;
            --accent: #3b82f6;
            --accent2: #6366f1;
            --text: #e2e8f0;
            --muted: #64748b;
            --border: rgba(255,255,255,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        /* Fond animé */
        .bg-glow {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(59,130,246,0.08), transparent),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(99,102,241,0.07), transparent),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(129,140,248,0.04), transparent);
            pointer-events: none;
        }
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* Card principale */
        .login-card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(59,130,246,0.04);
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -1px; left: 20%; right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
            border-radius: 2px;
        }

        /* Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }
        .logo-icon {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #05070f;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(59,130,246,0.25);
        }
        .logo-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }
        .logo-sub {
            color: var(--muted);
            font-size: 0.82rem;
            margin-top: 4px;
        }

        /* Form */
        .field-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .field-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.85rem;
        }
        .form-input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px 12px 40px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: rgba(59,130,246,0.4);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
            background: #141c2e;
        }
        .form-input::placeholder { color: var(--muted); }

        /* Alerte erreur */
        .alert-error {
            background: rgba(248,113,113,0.08);
            border: 1px solid rgba(248,113,113,0.25);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #fca5a5;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Bouton */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #05070f;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: 'Syne', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 4px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(59,130,246,0.35);
        }
        .btn-login:active { transform: translateY(0); }

        /* Footer lien */
        .card-footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.83rem;
            color: var(--muted);
        }
        .card-footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .card-footer-link a:hover { color: var(--accent2); }

        /* Separator */
        .sep {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }
        .sep-line { flex: 1; height: 1px; background: var(--border); }
        .sep-text { font-size: 0.75rem; color: var(--muted); }
    </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div class="login-card">
    <div class="logo-area">
        <div class="logo-icon">
            <i class="fa-solid fa-flask-vial"></i>
        </div>
        <span class="logo-title">Laboratoire LIAS</span>
        <div class="logo-sub">Faculté des Sciences Ben M'Sik — Casablanca</div>
    </div>

    <div th:if="${param.error}" class="alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>Email ou mot de passe incorrect. Compte peut-être désactivé.</span>
    </div>
    <div th:if="${param.logout}" class="alert-error" style="color:#86efac;border-color:rgba(59,130,246,0.25);background:rgba(59,130,246,0.06)">
        <i class="fa-solid fa-check-circle"></i>
        <span>Vous avez été déconnecté avec succès.</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label class="field-label">Adresse Email</label>
            <div class="field-wrap">
                <i class="fa-solid fa-envelope field-icon"></i>
                <input type="email" name="username" class="form-input" placeholder="nom@lias.ma" required autofocus>
            </div>
        </div>
        <div>
            <label class="field-label">Mot de passe</label>
            <div class="field-wrap">
                <i class="fa-solid fa-lock field-icon"></i>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Se connecter
        </button>
    </form>

    <div class="sep">
        <div class="sep-line"></div>
        <span class="sep-text">ou</span>
        <div class="sep-line"></div>
    </div>

    <div class="card-footer-link">
        Pas encore membre ?
        <a href="/adhesion/nouveau">Déposer une candidature</a>
    </div>
    <div class="card-footer-link mt-2">
        <a href="/" style="color:var(--muted)">
            <i class="fa-solid fa-arrow-left me-1"></i>Retour à l'accueil
        </a>
    </div>
</div>
</body>
</html>
