<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--accent:#3b82f6;--accent2:#6366f1;--text:#e2e8f0;--muted:#64748b;--border:rgba(255,255,255,0.06); }
        * { margin:0;padding:0;box-sizing:border-box; }
        body { background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif; }
        .main-content { margin-left:250px;padding:32px; }
        .page-title { font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px; }
        .card-dark { background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px; }
        .notif-item { display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border); }
        .notif-item:last-child { border-bottom:none; }
        .notif-icon { width:38px;height:38px;border-radius:10px;background:rgba(59,130,246,0.1);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
        .notif-unread .notif-icon { background:rgba(99,102,241,0.15);color:var(--accent2); }
        .notif-msg { font-size:0.88rem;line-height:1.5; }
        .notif-date { font-size:0.75rem;color:var(--muted);margin-top:4px; }
        .notif-unread .notif-msg { font-weight:600;color:white; }
        .badge-new { background:var(--accent2);color:#0a0e1a;border-radius:20px;padding:2px 8px;font-size:0.68rem;font-weight:700;margin-left:8px; }
    </style>
</head>
<body>
<div th:replace="~{sidebar :: sidebar}"></div>
<div class="main-content">
    <div class="page-title"><i class="fa-solid fa-bell me-2"></i>Mes Notifications</div>
    <p style="color:var(--muted);margin-bottom:24px">Toutes vos notifications du laboratoire</p>

    <div class="card-dark">
        <div th:if="${notifications != null and !notifications.isEmpty()}">
            <div th:each="n : ${notifications}"
                 th:classappend="${!n.lue} ? 'notif-unread'"
                 class="notif-item">
                <div class="notif-icon">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div>
                    <div class="notif-msg">
                        <span th:text="${n.message}"></span>
                        <span th:if="${!n.lue}" class="badge-new">Nouveau</span>
                    </div>
                    <div class="notif-date" th:text="${#temporals.format(n.dateCreation,'dd/MM/yyyy HH:mm')}"></div>
                    <div th:if="${n.lien}" class="mt-1">
                        <a th:href="${n.lien}" style="font-size:0.78rem;color:var(--accent2)">Voir le détail →</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${notifications == null or notifications.isEmpty()}" style="text-align:center;padding:60px 0;color:var(--muted)">
            <i class="fa-regular fa-bell-slash fa-3x mb-3 d-block"></i>
            Aucune notification pour le moment.
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
