version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-lias
    environment:
      MYSQL_ROOT_PASSWORD: lias2026
      MYSQL_DATABASE: lias_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plias2026"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
